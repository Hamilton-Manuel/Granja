name: granja-el-chiflon

services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: granja-database
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_SA_PASSWORD}"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    container_name: granja-azurite
    restart: unless-stopped
    command: azurite-blob --blobHost 0.0.0.0 --location /data
    ports:
      - "10000:10000"
    volumes:
      - azurite_data:/data

volumes:
  sqlserver_data:
  azurite_data:
