name: granja-el-chiflon

services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: granja-database
    restart: unless-stopped

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${DB_SA_PASSWORD}"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

volumes:
  sqlserver_data: